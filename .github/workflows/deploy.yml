name: Deploy

on:
  push:
    branches: [main]

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets (Settings → Secrets → Actions):
#
#   FIREBASE_SERVICE_ACCOUNT  — Firebase service-account JSON (from Firebase Console
#                               → Project Settings → Service Accounts → Generate key)
#   EC2_API_URL               — Public URL of the EC2 backend, e.g. http://1.2.3.4:8000
#                               (used to prefix /api/* calls in the built frontend)
#   EC2_HOST                  — EC2 public IP or hostname
#   EC2_USER                  — SSH user, typically "ubuntu" or "ec2-user"
#   EC2_SSH_KEY               — EC2 SSH private key (the .pem file contents)
#   DOCKERHUB_USERNAME        — DockerHub account username
#   DOCKERHUB_TOKEN           — DockerHub access token (Account Settings → Security)
# ─────────────────────────────────────────────────────────────────────────────

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/financial-dashboard-backend

jobs:
  # ── 1. Build React frontend and deploy to Firebase Hosting ──────────────────
  deploy-frontend:
    name: Frontend → Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: FD/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: FD/frontend

      - name: Build
        run: npm run build
        working-directory: FD/frontend
        env:
          # Prefixed onto every /api/* fetch call at build time
          VITE_API_URL: ${{ secrets.EC2_API_URL }}

      - name: Deploy to Firebase Hosting (live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken:              ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId:              financial-dashboard-3e265
          channelId:              live
          entryPoint:             FD   # directory that contains firebase.json

  # ── 2. Build Docker image, push to DockerHub, deploy to EC2 ────────────────
  deploy-backend:
    name: Backend → EC2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        working-directory: FD
        run: |
          IMAGE=${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          docker build -f Dockerfile -t $IMAGE -t ${{ env.DOCKER_IMAGE }}:latest .
          docker push $IMAGE
          docker push ${{ env.DOCKER_IMAGE }}:latest
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     IMAGE
          script: |
            # Pull the new image
            docker pull $IMAGE

            # Stop and remove the old container (ignore errors if not running)
            docker stop fd-backend 2>/dev/null || true
            docker rm   fd-backend 2>/dev/null || true

            # Start with persistent data volumes and the .env file
            # /opt/fd/.env must be pre-created on the EC2 instance with API keys
            docker run -d \
              --name fd-backend \
              --restart unless-stopped \
              -p 8000:8000 \
              -v /opt/fd/data:/app/data \
              -v /opt/fd/uploads:/app/uploads \
              --env-file /opt/fd/.env \
              $IMAGE

            # Clean up dangling images to free disk space
            docker image prune -f
